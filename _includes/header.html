<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.title | escape }} — home">
      <img
  class="brand-logo"
  src="{{ '/assets/images/birdflag-logo.svg' | relative_url }}"
  alt=""
  decoding="async"
>

      <span class="brand-name">{{ site.title | escape }}</span>
    </a>

    <nav class="site-nav" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}#work"{% if page.url == '/' %} aria-current="page"{% endif %}>Work</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
      <a href="{{ '/contact/' | relative_url }}"{% if page.url == '/contact/' %} aria-current="page"{% endif %}>Contact</a>
    </nav>
  </div>
</header>
