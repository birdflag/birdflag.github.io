{% assign analytics_id = site.google_analytics | default: "" | strip %}
{% if jekyll.environment == "production" and analytics_id != "" %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ analytics_id | url_encode }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() {
      window.dataLayer.push(arguments);
    }

    gtag("js", new Date());
    gtag("config", {{ analytics_id | jsonify }});
  </script>
{% endif %}
