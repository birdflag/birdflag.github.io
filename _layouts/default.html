<!doctype html>
<html lang="{{ site.lang | default: 'en' | escape }}">
  {% include head.html %}
  <body id="top">
    <a class="skip-link" href="#main">Skip to content</a>

    {% include header.html %}

    <main id="main" tabindex="-1">
      {{ content }}
    </main>

    {% include footer.html %}

    {% if page.gallery %}
      {% include image-viewer.html %}
    {% endif %}

    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  </body>
</html>
