title: Hannah Fogarty
description: Independent graphic designer in San Francisco, specializing in brand identity and packaging for food, drink, and other good things.
email: hfogartydesign@gmail.com
location: San Francisco
lang: en

# Leave empty for a root-level local preview.
# Set before publishing.
url: ""
baseurl: ""

social_image: /images/Dessertbutterpouches_mockup.jpg

markdown: kramdown
highlighter: rouge
strict_front_matter: true

collections:
  projects:
    output: true
    permalink: /work/:name/

include:
  - _pages

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: pages
    values:
      layout: page

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - unpack_files.py
  - unpack_v5.py
  - portfolio.bundle.txt
  - portfolio-v5.bundle.txt
  - vendor
  - .github

# Google Analytics 4
google_analytics: "G-91PW6GB8ZT"
